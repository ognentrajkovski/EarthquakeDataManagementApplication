services:

  mongo:
    image: mongo:7
    container_name: earthquake-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-mongouser}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-mongopass}
      MONGO_INITDB_DATABASE: earthquakedb
    ports:
      - "27017:27017"
    volumes:
      - earthquake-mongodata:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${DOCKERHUB_USERNAME:-ognentrajkovski}/earthquake-backend:latest
    build:
      context: ./backend
    container_name: earthquake-backend
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      # MongoDB URI — credentials read from shell env / .env file
      MONGODB_URI: mongodb://${MONGO_USER:-mongouser}:${MONGO_PASSWORD:-mongopass}@mongo:27017/earthquakedb?authSource=admin
      # CORS — allow the dockerised frontend and the Vite dev server
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    image: ${DOCKERHUB_USERNAME:-ognentrajkovski}/earthquake-frontend:latest
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    container_name: earthquake-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "5173:80"

volumes:
  earthquake-mongodata:
