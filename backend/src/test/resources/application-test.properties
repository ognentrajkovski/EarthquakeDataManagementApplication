# Embedded MongoDB is provided by de.flapdoodle.embed.mongo — no real instance needed.
# Spring Boot auto-configures it when the dependency is on the test classpath.

usgs.api.url=https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson
earthquake.magnitude.threshold=2.0
spring.web.cors.allowed-origins=http://localhost:5173

# Disable the USGS poller during tests to avoid real HTTP calls
earthquake.polling.enabled=false
