# ─── MongoDB ────────────────────────────────────────────────────────────────
# Credentials and host are injected via environment variables so that no
# secrets are stored in source control.  See docker-compose.yml for the
# Docker overrides; for local development export the variables in your shell
# or create a .env file (excluded from git).
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/earthquakedb}

# ─── Server ──────────────────────────────────────────────────────────────────
server.port=8080

# ─── USGS API ────────────────────────────────────────────────────────────────
usgs.api.url=https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson

# ─── Earthquake filtering ────────────────────────────────────────────────────
earthquake.magnitude.threshold=2.0

# ─── Scheduled USGS polling ──────────────────────────────────────────────────
earthquake.polling.enabled=true
earthquake.polling.interval-ms=60000
earthquake.polling.initial-delay-ms=5000

# ─── CORS ────────────────────────────────────────────────────────────────────
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ─── Actuator ────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
