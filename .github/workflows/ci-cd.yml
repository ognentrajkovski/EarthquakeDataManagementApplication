name: CI/CD Pipeline

on:
  push:
    branches: [main]

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/earthquake-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/earthquake-frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        id: tag
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          build-args: |
            VITE_API_URL=
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Start EC2 instance
        run: |
          echo " Starting EC2 instance..."
          aws ec2 start-instances --instance-ids ${{ secrets.EC2_INSTANCE_ID }}
          echo " Waiting for instance to be running..."
          aws ec2 wait instance-running --instance-ids ${{ secrets.EC2_INSTANCE_ID }}
          echo " EC2 instance is now running!"

      - name: Get EC2 public IP
        id: ec2-ip
        run: |
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "ip=$PUBLIC_IP" >> $GITHUB_OUTPUT
          echo " EC2 Public IP: $PUBLIC_IP"

      - name: Wait for SSH to be ready
        run: |
          echo " Waiting for SSH to be ready..."
          for i in {1..10}; do
            if ssh -o ConnectTimeout=5 -o StrictHostKeyChecking=no -i <(echo "${{ secrets.EC2_SSH_KEY }}") ec2-user@${{ steps.ec2-ip.outputs.ip }} exit 2>/dev/null; then
              echo " SSH is ready!"
              break
            fi
            echo " Attempt $i/10 - SSH not ready yet, waiting 10 seconds..."
            sleep 10
          done


      - name: Deploy to EC2 via Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.ec2-ip.outputs.ip }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 300s
          script: |
            set -e

            echo "Starting Docker Compose deployment on EC2..."
            
            echo "Cleaning up any stale docker sockets and restarting containerd..."
            sudo rm -f /var/run/docker.sock /var/run/docker.pid
            sudo systemctl restart containerd || true
            
            echo "Attempting to start Docker daemon..."
            sudo systemctl start docker || { 
              echo "Docker failed to start! Fetching logs..."
              sudo journalctl -xeu docker.service --no-pager
              sudo journalctl -xeu containerd.service --no-pager
              df -h
              exit 1
            }

            PROJECT_DIR=~/EarthquakeDataManagementApplication

            if [ ! -d "$PROJECT_DIR" ]; then
              echo "Cloning repository..."
              git clone https://github.com/${{ github.repository }} "$PROJECT_DIR"
            fi

            cd "$PROJECT_DIR"
            
            echo "Pulling latest code changes..."
            git pull origin main

            echo "Writing .env file..."
            cat > .env <<EOF
            MONGO_USER=${{ secrets.MONGO_ROOT_USERNAME }}
            MONGO_PASSWORD=${{ secrets.MONGO_ROOT_PASSWORD }}
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            EOF

            echo "Stopping existing containers..."
            docker-compose down --remove-orphans || true
            
            echo "Pulling latest images..."
            docker-compose pull || true

            echo "Starting new containers..."
            docker-compose up -d 

            echo "Deployment completed successfully! Your application is now live on Port 80."
