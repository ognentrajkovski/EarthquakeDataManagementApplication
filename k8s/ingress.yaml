apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: earthquake-ingress
  namespace: earthquake-app
  annotations:
    # Depends on the ingress controller installed on the EC2 cluster (e.g. traefik or nginx)
    kubernetes.io/ingress.class: "nginx"
    # If using Nginx ingress, rewrite target isn't strictly necessary for these exact paths if backend handles /api,
    # but the backend Spring app probably expects /api/earthquakes based on README
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
