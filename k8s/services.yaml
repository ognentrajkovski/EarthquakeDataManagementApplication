# Backend Service (ClusterIP for internal communication)
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: earthquake-app
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
# Frontend Service (LoadBalancer for external access)
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: earthquake-app
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
---
# MongoDB Service (ClusterIP for internal communication)
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  namespace: earthquake-app
  labels:
    app: mongodb
spec:
  ports:
    - port: 27017
      targetPort: 27017
  selector:
    app: mongodb
  type: ClusterIP
