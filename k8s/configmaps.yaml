# ConfigMap for Application
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: earthquake-app
data:
    MONGO_DATABASE: "earthquakedb"
    SPRING_PROFILES_ACTIVE: "production"
    MONGO_HOST: "mongodb-service"
    MONGO_PORT: "27017"
    CORS_ALLOWED_ORIGINS: "*"
---
# ConfigMap for Frontend Application
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: earthquake-app
data:
    VITE_API_URL: ""
---
# ConfigMap for MongoDB
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-config
  namespace: earthquake-app
data:
    MONGO_INITDB_DATABASE: "earthquakedb"
