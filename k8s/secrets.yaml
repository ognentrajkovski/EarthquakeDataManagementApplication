apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: earthquake-app
type: Opaque
stringData:
  # Note: For real production deployments, avoid committing secrets to version control.
  # Use SOPS, HashiCorp Vault, or AWS Secrets Manager instead.
  MONGO_INITDB_ROOT_USERNAME: "mongouser"
  MONGO_INITDB_ROOT_PASSWORD: "mongopass"
